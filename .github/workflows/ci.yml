name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    # A real Postgres, not sqlite/mocks -- the detection engine leans on
    # Postgres-specific things (JSONB, date_trunc), so testing against
    # anything else would hide exactly the bugs that matter.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelhub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Run from the repo root (not backend/) with PYTHONPATH=backend --
      # test_detection.py reads docs/sample_auth.log as a relative path,
      # and docs/ is a sibling of backend/, not a child of it. Docker gets
      # away with a plain `pytest` from backend/ because docker-compose
      # separately bind-mounts docs/ at backend's WORKDIR (./docs:/app/docs);
      # a bare checkout has no such mount, so this has to match the real
      # repo layout instead.
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: pytest backend/app/tests -v

  backend-image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image (no dev/test deps)
        run: docker build ./backend -t sentinelhub-backend:ci

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
