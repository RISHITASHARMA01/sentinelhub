server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing -- any path that isn't a real
    # static file (e.g. a refresh on /alerts) should fall back to
    # index.html and let the app's router take over.
    location / {
        try_files $uri /index.html;
    }
}
